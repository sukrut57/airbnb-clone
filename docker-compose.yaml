version: '3.9'

services:
  postgres:
    container_name: airbnb_clone_postgres
    image: postgres:16.1
    environment:
      POSTGRES_DB: airbnb_clone
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - airbnb_clone_network
    restart: unless-stopped

  keycloak:
    container_name: airbnb_clone_keycloak
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - '9090:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: airbnb_clone_postgres
      KC_DB_URL_DATABASE: airbnb_clone
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password
    depends_on:
      - postgres
    networks:
      - airbnb_clone_network
    restart: unless-stopped
    command: start-dev

  redis:
    image: 'redis:latest'
    container_name: 'redis'
    restart: unless-stopped
    volumes:
      - 'redis_volume_data:/data'
    ports:
      - '6379:6379'
    networks:
      - airbnb_clone_network

  redis-insight:
    image: 'redislabs/redisinsight:latest'
    container_name: 'redis-insight'
    ports:
      - '8001:8001'
    depends_on:
      - redis
    networks:
      - airbnb_clone_network
    volumes:
      - 'redis_insight_volume_data:/db'
volumes:
  postgres:
  keycloak:
  redis_volume_data:
  redis_insight_volume_data:

networks:
  airbnb_clone_network:
    driver: bridge